controller_manager:
  ros__parameters:
    update_rate: 500
    enforce_command_limits: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_effort_controller:
      type: effort_controllers/JointGroupEffortController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    twist_broadcaster:
      type: crisp_controllers/TwistBroadcaster

    pose_broadcaster:
      type: crisp_controllers/PoseBroadcaster

    gravity_compensation:
      type: crisp_controllers/CartesianController

    joint_impedance_controller:
      type: crisp_controllers/CartesianController

    cartesian_impedance_controller:
      type: crisp_controllers/CartesianController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

forward_effort_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: effort

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0

twist_broadcaster:
  ros__parameters:
    joints:
      - elbow_joint
      - shoulder_pan_joint
      - shoulder_lift_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    end_effector_frame: tool0
    base_frame: base_link

pose_broadcaster:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    end_effector_frame: tool0
    base_frame: base_link

gravity_compensation:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    end_effector_frame: tool0
    base_frame: base_link
    task:
      k_pos_x: 0.0
      k_pos_y: 0.0
      k_pos_z: 0.0
      k_rot_x: 30.0
      k_rot_y: 30.0
      k_rot_z: 30.0
    nullspace:
      stiffness: 0.0
    use_friction: true
    use_coriolis_compensation: true
    use_local_jacobian: true

joint_impedance_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    end_effector_frame: tool0
    base_frame: base_link
    task:
      k_pos_x: 0.0
      k_pos_y: 0.0
      k_pos_z: 0.0
      k_rot_x: 0.0
      k_rot_y: 0.0
      k_rot_z: 0.0
    max_delta_tau: 0.5
    nullspace:
      stiffness: 5.0
      projector_type: none
      damping: 0.5
      max_tau: 5.0
      regularization: 1.0e-06
      weights:
        shoulder_pan_joint.value: 150.0
        shoulder_lift_joint.value: 150.0
        elbow_joint.value: 150.0
        wrist_1_joint.value: 100.0
        wrist_2_joint.value: 100.0
        wrist_3_joint.value: 100.0
    use_friction: true
    use_coriolis_compensation: true
    use_local_jacobian: true
    limit_error: true
    limit_torques: true

cartesian_impedance_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    end_effector_frame: tool0
    base_frame: base_link
    filter:
      q: 0.5
      dq: 0.5
      output_torque: 0.5
      target_pose: 0.1
    task:
      k_pos_x: 400.0
      k_pos_y: 400.0
      k_pos_z: 400.0
      k_rot_x: 30.0
      k_rot_y: 30.0
      k_rot_z: 30.0
    nullspace:
      stiffness: 0.0
      damping: 0.0
      max_tau: 2.0
    use_friction: false
    use_coriolis_compensation: true
    use_local_jacobian: true
